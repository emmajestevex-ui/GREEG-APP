name: Build GREEG APP IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Mostrar schemes disponibles
        run: xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Compilar GREEG APP
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Buscar aplicación compilada
        run: |
          echo "Buscando .app..."
          find build -type d -name "*.app" -print

      - name: Crear IPA unsigned
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No se encontró la aplicación compilada."
            exit 1
          fi

          echo "App encontrada en: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r GREEG_APP_unsigned.ipa Payload

          echo "IPA creada correctamente:"
          ls -lh GREEG_APP_unsigned.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: GREEG-APP-unsigned
          path: GREEG_APP_unsigned.ipa
          if-no-files-found: error
          retention-days: 30
