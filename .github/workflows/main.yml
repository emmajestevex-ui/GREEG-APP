name: Build GREEG APP IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Mostrar schemes disponibles
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Compilar GREEG APP
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crear IPA unsigned
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "No se encontró el archivo .app"
            exit 1
          fi

          echo "App encontrada: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r GREEG-APP-unsigned.ipa Payload

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: GREEG-APP-unsigned
          path: GREEG-APP-unsigned.ipa
